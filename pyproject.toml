[project]
name = "needle-tr"
version = "0.1.9"
description = "Türkçe Araç Çağırıcı ve Fine-Tuning Sistemi"
readme = "README.md"
authors = [
    { name = "emrekayik", email = "emrekayik1905@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cactus-needle>=3.0.5",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
train = [
    "datasets>=5.0.1",
    "flax>=0.10.7",
    "huggingface-hub>=0.28.0",
    "jax>=0.6.2",
    "optax>=0.2.8",
    "peft>=0.21.0",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "trl>=1.14.0",
]

[project.scripts]
needle-tr = "needle_tr.cli:main"
needle-agent = "needle_tr:main"

[project.urls]
Homepage = "https://github.com/emrekayik/needle-tr"
Repository = "https://github.com/emrekayik/needle-tr"
Issues = "https://github.com/emrekayik/needle-tr/issues"


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
