[project]
name = "needle-tr"
version = "0.3.0"
description = "Needle 3 Türkçe Araç Çağırıcı ve Fine-Tuning Sistemi (Cactus Compute)"
readme = "README.md"
authors = [
    { name = "emrekayik", email = "emrekayik1905@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "cactus-needle[train]>=3.0.5",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
needle = "needle.cli:main"
needle-tr = "needle_tr.cli:main"
needle-agent = "needle_tr:main"

[project.urls]
Homepage = "https://github.com/emrekayik/needle-tr"
Repository = "https://github.com/emrekayik/needle-tr"
Issues = "https://github.com/emrekayik/needle-tr/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
